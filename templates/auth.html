<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Portal — RazorRecover AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; background: var(--bg-dark);">
  <!-- Header -->
  <header style="padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); background: #ffffff;">
    <a href="/" style="display: flex; align-items: center; gap: 12px;">
      <div class="brand-logo">R</div>
      <div class="brand-text">
        <span class="brand-name">RazorRecover AI</span>
        <span class="brand-tag">Merchant Portal</span>
      </div>
    </a>
    <div class="demo-badge-banner">
      <span class="demo-badge-dot"></span>
      <span>Demo environment · Synthetic transaction dataset</span>
    </div>
  </header>

  <!-- Auth Card -->
  <main style="padding: 48px 20px; display: flex; justify-content: center; align-items: center;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 32px; background: #ffffff; border: 1px solid var(--border-subtle); box-shadow: var(--shadow-md);">
      
      <!-- Instant Demo Login Button -->
      <div style="margin-bottom: 24px;">
        <button class="btn btn-accent" id="btn-demo-login" style="width: 100%; padding: 12px; font-size: 14px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          Instant Merchant Demo Access
        </button>
        <p style="font-size: 11.5px; color: var(--text-dim); text-align: center; margin-top: 8px;">
          One-click access with seeded 10,000+ transaction dataset
        </p>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
        <span style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600;">Or Login Manually</span>
        <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
      </div>

      <!-- Auth Tabs -->
      <div style="display: flex; border-bottom: 1px solid var(--border-subtle); margin-bottom: 24px;">
        <button id="tab-login" class="nav-item active" style="flex: 1; text-align: center; justify-content: center; border-radius: 0; border-bottom: 2px solid var(--razorpay-blue); background: transparent; color: var(--razorpay-blue);">
          Log In
        </button>
        <button id="tab-signup" class="nav-item" style="flex: 1; text-align: center; justify-content: center; border-radius: 0; background: transparent; border-bottom: 2px solid transparent; color: var(--text-muted);">
          Sign Up
        </button>
      </div>

      <!-- Error Alert Box -->
      <div id="auth-error-box" style="display: none; padding: 10px 14px; margin-bottom: 18px; border-radius: var(--radius-sm); background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); font-size: 12.5px;"></div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Merchant Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="merchant@razorpay.com" value="merchant@razorpay.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" value="demo123" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          Log In to Dashboard
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="signup-merchant">Merchant / Store Name</label>
          <input type="text" id="signup-merchant" class="form-control" placeholder="e.g. Acme Ecommerce" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-email">Work Email</label>
          <input type="email" id="signup-email" class="form-control" placeholder="you@company.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-password">Create Password</label>
          <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          Create Merchant Account
        </button>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer style="padding: 20px 40px; border-top: 1px solid var(--border-subtle); background: #ffffff; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim);">
    <div>RazorRecover AI · Supabase PostgreSQL Database</div>
    <div>Demo credentials: <code>merchant@razorpay.com</code> / <code>demo123</code></div>
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
